max_width = 140             # Максимальна ширина рядка в символах. Якщо рядок перевищує цю ширину, rustfmt автоматично розбиває його на кілька рядків.
fn_call_width = 130         # Максимальна ширина для викликів функцій. Якщо виклик функції перевищує цю ширину, він буде розбитий на кілька рядків.
attr_fn_like_width = 90     # Максимальна ширина для атрибутів, які виглядають як виклики функцій (наприклад, #[derive(...)]. Якщо атрибут перевищує цю ширину, він буде розбитий на кілька рядків.
struct_lit_width = 38       # Максимальна ширина для літералів структур. Якщо літерал структури перевищує цю ширину, він буде розбитий на кілька рядків.
struct_variant_width = 55   # Максимальна ширина для варіантів enum, які виглядають як структури. Якщо варіант перевищує цю ширину, він буде розбитий на кілька рядків.
array_width = 130           # Максимальна ширина для масивів. Якщо масив перевищує цю ширину, він буде розбитий на кілька рядків.
chain_width = 130           # Максимальна ширина для ланцюжків викликів методів. Якщо ланцюжок перевищує цю ширину, він буде розбитий на кілька рядків.
single_line_if_else_max_width = 130  # Максимальна ширина для однорядкових конструкцій if-else. Якщо конструкція перевищує цю ширину, вона буде розбита на кілька рядків.

